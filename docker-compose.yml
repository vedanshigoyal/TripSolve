services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tripsolve-db
    environment:
      POSTGRES_USER: tripsolve
      POSTGRES_PASSWORD: tripsolve
      POSTGRES_DB: tripsolve
    # 5433 on the host because a local PostgreSQL already uses 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripsolve"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
